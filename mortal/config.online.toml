# v4 online training on the 2x RTX 4070 Ti SUPER box: the model plays against a
# frozen copy of itself and learns from those games instead of from human ones.
#
#     /root/launch_online.sh
#
# Three kinds of process share the box and this file:
#
#   server.py   holds the current parameters and the replay buffer
#   train.py    MORTAL_DEVICE=cuda:0, trains on what the workers send back
#   client.py   MORTAL_DEVICE=cuda:1, plays and submits, several of them
#
# The loss changes with `online`: the CQL term, which keeps an offline model
# near the human moves it was shown, is dropped, and what is left regresses Q
# onto the points the trainee actually scored. That is what lets it pass the
# players it learned from, and it only works while the games keep coming, so
# self-play throughput is the thing to watch here, not steps/s alone.
#
# DDP is refused in online mode (train.py), so the trainer has one GPU. The
# other one and most of the CPUs go to the workers.

[control]
version = 4
online = true

# Its own run directory: the offline run's checkpoints stay untouched, and a
# bad online run can be thrown away by deleting one directory.
state_file = 'logs/v4o/mortal.pth'
best_state_file = 'logs/v4o/best.pth'
tensorboard_dir = 'logs/v4o'

# Overridden per process by MORTAL_DEVICE; this is the trainer's.
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true
# Not 'reduce-overhead' here, which captures CUDA graphs. A graph's memory
# lives in a private pool that no other allocation can borrow, and offline's
# 1024 was split across two GPUs where online's sits whole on one: the first
# evaluation died with 14.04 GiB in graph pools and 53 MB free, on a 132 MB
# request. It costs nothing to give up. The trainer waits on the workers for
# 91% of its time -- self-play is what online is short of, never step speed --
# so a slower step is a step that still finishes long before the next game does.
compile_mode = 'default'
# Over ~5,000 steps as offline, but online steps are ~10x rarer, so this is a
# much longer window in games played. Kept because the average was ahead of the
# trained weights in every offline evaluation.
ema_decay = 0.9998

# One GPU now, so the whole 1024 of the offline global batch is on it. The
# schedule below was tuned for that batch size.
batch_size = 1024
opt_step_every = 1

save_every = 400
# ~2.8 h of online training. Evaluation is the only honest signal in online RL
# -- the training loss falls as the trainee gets better at predicting its own
# points, which says nothing about whether it plays better -- but the trainer
# plays all 4000 games itself here, with the workers still holding most of the
# CPUs, so each one costs ~20 minutes against ~9 offline.
#
# 30,000 with 8,000 walls since 2026-09-23: train more, measure less often and
# larger. The gate compares two checkpoints on one wall set, and its error
# falls with the square root of the walls, so one evaluation of 8,000 says
# more than eight of 1,000 -- which also each pass the gate or not on their
# own noise. Real progress over 30,000 steps (520k -> 560k gained 0.0235 of
# rank in 40,000) is ~2.4 se at 8,000 walls; over 10,000 at 1,000 it was ~0.3.
test_every = 30000
# The workers pick up new parameters this often. Small enough that the games
# coming back are nearly on-policy, large enough not to spend the run copying
# 43 MB of weights around.
submit_every = 400

# using env `TRAIN_PLAY_PROFILE`
[train_play.default]
# Games in flight, and the one setting that moved self-play throughput: the
# arena advances every game it holds in one pass, so a pass costs about the
# same whether it is carrying 400 games or 3,200, and what it returns per pass
# scales with how many it holds. Measured on the idle box, one arena against
# three v4 copies: 400 games 2.75 hanchans/s, 1,600 games 5.55. The cost is
# staleness -- a session is a round trip, and nothing in it sees a parameter
# update -- which at ~6 hanchans/s is about nine minutes here.
games = 3200
log_dir = 'challenger/train_play'
# Exploration. Upstream's v3 online used this and it is already more than it
# sounds: it is the chance per decision of sampling from a temperature-0.05
# softmax rather than taking the best action.
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1
# Arenas this worker splits its session across, in threads. Measured worse at
# every setting tried -- 400 games in one arena 2.75 hanchans/s, in two 2.48,
# in four 1.82 -- because splitting a session is splitting the games in flight,
# and that is what throughput scales with. Left here at 1 because the knob is
# what the measurement is recorded against; more *processes* is the way to use
# more of the box (see WORKERS in launch_online.sh).
arenas = 1

[test_play]
# The same v3 opponent as offline, so avg_rank stays on one scale across the
# whole project. 8,000 walls, dealt four ways; see test_every.
games = 32000
log_dir = 'challenger/test_play'
# Walls per piece: the 8,000 are played 250 at a time, every track together
# within each piece. Same games, a quarter of the batch. On a one-card box the
# workers hold 5.3 GB of 8 while the trainer evaluates, and all 1,000 at once
# left the allocator 5 MB short (570k, 2026-09-23). The pieces cost little
# time there too: the workers already have the CPUs, so three tracks at once
# were only splitting them.
chunk = 250
# Selection. Off, a checkpoint is kept when its absolute score beats every
# score before it, which is a rolling maximum over one fixed wall set: 16
# evaluations offline and 7 online, every one of them the argmax of its own
# noise at se 1.33 pt. On, a candidate has to beat the reigning champion over
# the same walls, paired, and the walls move on every evaluation so no model
# passes twice on the same luck. Measured 2026-09-22: the 600k checkpoint was
# 0.0178 of rank worse than the 560k one and the rolling maximum could not see
# it, so the run trained 40,000 steps into a decline.
gate = true
# How far ahead a candidate has to be, in standard errors, to take the title.
#
# 0 -- "just win" -- is the wrong default, which a simulation said and intuition
# did not. A candidate that is slightly worse still wins the coin flip about
# half the time, so against a truth that is declining the champion follows it
# down one accepted tie at a time. Over eight evaluations of the 0.0178 decline
# at 1,000 walls each, margin 0 keeps a checkpoint 0.0138 off the peak, margin
# 0.5 keeps 0.0091, and margin 1.0 keeps 0.0045. The cost on the other side is
# small: against the 0.0125 gain the online phase really made, margin 0 keeps
# -0.0113 of it and margin 1.0 keeps -0.0084.
gate_margin = 1.0
# Consecutive evaluations without a new champion before the run stops itself.
# 0 never stops.
#
# Worth knowing before turning it on: at these settings one evaluation's worth
# of real progress is about 0.07 se, so a stopping rule cannot distinguish "not
# improving" from "improving too slowly to see". Patience 4 at margin 1.0 ends
# a declining run after 4.9 evaluations instead of 8 and keeps a checkpoint
# 0.0025 off the peak rather than 0.0045 -- but it also ends an *improving* run
# early, keeping -0.0043 of the gain rather than -0.0084. Leave it at 0 for a
# run expected to improve; set it for one being asked whether it still can.
#
# The real lever is neither knob. One evaluation here is 1,000 walls; the same
# comparison at 8,000 has half the noise. Evaluate rarely and large.
#
# 2 for the run from 560k with the trunk frozen to its last 4 blocks, which is
# exactly the second kind: it is asking whether freezing lets self-play get
# past 560k at all. At 8,000 walls one evaluation carries a third of the noise
# of the old 1,000, and the gain 520k -> 560k made is ~2.4 se per 30,000 steps,
# so two in a row without a new champion is the answer "no" -- after 60,000
# steps, where three would have taken 90,000.
gate_patience = 2

[dataset]
# Online reads the drained self-play logs, whose paths the server hands over;
# these globs are for offline corpora and stay empty.
parquet_globs = []
globs = []
file_index = 'logs/v4o/file_index.pth'
file_batch_size = 20
# Each prefetched batch is 1024 x 1012 x 34 float32, 141 MB, held in shared
# memory and again pinned. Four each from six loaders kept 7.3 GB of them
# queued in the trainer on a 30 GB box, for a trainer that waits on data 90% of
# the time anyway: self-play is the bottleneck, and depth here buys nothing.
prefetch_factor = 2
in_order = false
reserve_ratio = 0.2
# The trainer must decode gz logs at the rate it consumes them, ~1,000
# instances/s, which is ~6 cores of v4 encoding. The rest of the box belongs to
# the workers, who need far more of it.
#
# Three loaders of two threads rather than six of one: the same six cores of
# encoding, but each loader also holds ~2 GB of decoded games, and six of them
# with the queue above left 5 GB of a 30 GB cgroup for an evaluation that
# plays 12,000 games at once. launch_online.sh sizes the threads from this.
num_workers = 3
# Only the trainee's seat is learned from; the three champions' seats are
# discarded. train.py sets that filter itself in online mode, so this list,
# which selects human players out of a corpus, stays empty.
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

[env]
gamma = 1
pts = [3.0, 1.5, 0.0, -4.5]

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
# Unused online: train.py drops the CQL term entirely once `online` is set.
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze]
# How many of the trunk's residual blocks self-play is allowed to move,
# counted from the output end. 0 trains the whole trunk, which is what every
# run so far did and what the offline configs still do (they have no [freeze]
# section, so they take the 0).
#
# Why this exists. The online objective is a Monte-Carlo regression of Q onto
# the kyoku just played: `q_target = gamma ** steps_to_done * kyoku_rewards`
# with gamma = 1, so every decision in a kyoku gets the same target, and Q is
# only ever fitted on actions that were actually taken. Nothing in it maintains
# a value for an action the policy has stopped taking -- CQL is dropped online
# and there is no bootstrap -- and the only thing keeping those actions in the
# data at all is `boltzmann_epsilon`, which is 0.005. So the policy can
# contract onto what it already does and cannot discover that something it
# gave up was good. Measured over 520k -> 600k it did exactly that: houjuu rate
# -2.04pp and agari rate -1.09pp, monotonically, along one axis.
#
# Freezing the early trunk leaves the features learned from 1.6M human games
# where they are and lets self-play move only the part that reads them.
#
# 4 of 40 is a starting point, not a measured optimum. Nothing here says what
# the right number is; the gate in [test_play] is what will say whether a given
# number is earning its place.
trainable_blocks = 4

[freeze_bn]
# The batches now come from the trainee's own play, which shifts as it learns.
# Letting BatchNorm chase that moves the model under the workers' feet between
# parameter submissions; frozen statistics keep the two in step.
mortal = true

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
# Flat at where the offline cosine ended. Online steps are few and each one is
# expensive in games, so the run improves by playing more, not by moving
# further per step; a larger rate here mostly undoes what offline learned.
peak = 1e-5
final = 1e-5
warm_up_steps = 200
max_steps = 1000000

# The opponent. `train` is who the workers play against: a frozen copy of the
# model, so the trainee has to beat the best version of itself rather than a
# fixed old bot. Refresh it deliberately (launch_online.sh does not), and never
# mid-session, or the games in one buffer will have been played against two
# different opponents.
[baseline.train]
device = 'cuda:1'
enable_compile = false
state_file = 'logs/v4o/champion.pth'

# `test` stays the v3 baseline for ever: it is the ruler, not an opponent to
# improve against, and a ruler that changes measures nothing.
[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = 'logs/baseline.pth'

[online]
history_window = 50
# Published parameter sets kept on disk, newest first, as logs/v4o/params/v<n>.pth.
# The games a worker submits carry the version that played them, and pricing
# them for a policy gradient means loading those exact weights again. A session
# is a round trip of about ten minutes, which at ~1.5 steps/s and a publish
# every 400 steps is three or four versions, so eight covers a worker that
# falls well behind. Each is ~43 MB.
param_history = 8
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = 'online/buffer'
drain_dir = 'online/drain'
# Games the buffer holds before it tells the workers to stop submitting. Two
# sessions' worth per worker: enough that the trainer is never idle, small
# enough that nothing it trains on is many parameter versions old.
capacity = 19200
sample_reuse_rate = 0
sample_reuse_threshold = 0
# false: the trainer takes whatever has arrived rather than waiting for a full
# buffer. With several workers submitting at different times, waiting would
# leave both sides idle in turn.
force_sequential = false

[test]
stochastic_latent = false

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = 'challenger/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = 'logs/v4o/best.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = 'logs/baseline.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = '/path/to/akochan'
tactics = '/path/to/tactics.json'

[grp]
state_file = 'grp_v2/grp.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = false
tensorboard_dir = 'grp_v2/log'

batch_size = 1024
save_every = 2000
val_steps = 400

[grp.dataset]
train_globs = []
val_globs = []
file_index = 'grp_v2/log/grp_file/grp_file_index.pth'
file_batch_size = 100

[grp.optim]
lr = 1e-5
